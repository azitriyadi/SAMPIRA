<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | SAMPIRA</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/facility-reports.css?v=phase4b">
    <script src="/assets/js/portal-session.js?v=phase5b" defer></script>
    <link rel="stylesheet" href="/assets/css/facility-handling.css?v=phase4b">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/location-map.css?v=phase5b">
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <script type="module" src="/assets/js/facility-reports.js?v=phase5b"></script>
</head>
<body class="facility-admin-page">
    <header class="facility-admin-bar">
        <div class="container">
            <h1>Admin SAMPIRA</h1>
            <form action="/logout" method="post">
                <button class="facility-button" type="submit">Keluar</button>
            </form>
        </div>
    </header>
    <main class="container facility-admin-main" aria-label="Portal Admin">
        <nav class="handling-nav" aria-label="Pekerjaan laporan fasilitas">
            <button type="button" class="facility-button" data-open-verification aria-controls="admin-report-verification" aria-pressed="true">Verifikasi Laporan</button>
            <button type="button" class="facility-button" data-open-handling aria-controls="admin-facility-handling" aria-pressed="false">Penanganan Laporan</button>
        </nav>
        <section id="admin-report-verification" data-facility-reports="admin" aria-labelledby="facility-heading">
            <noscript>Aktifkan JavaScript untuk membuka antrean laporan fasilitas.</noscript>
        </section>
        <section id="admin-facility-handling" data-facility-handling="admin" hidden></section>
    </main>
</body>
</html>
